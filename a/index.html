<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Метод Крамера</title>
</head>
<body>
  <h4>1161595</h4>

  <input id="n1" value="2"> x + <input id="n2" value="3"> y = <input id="n3" value="18"><br><br>

  <input id="n4" value="4"> x + <input id="n5" value="-5"> y = <input id="n6" value="-8"><br><br>

  <button id="bt">Вычислить!</button><br><br>

  x = <input id="result1"> <br>
  y = <input id="result2">

  <script>
    document.getElementById('bt').onclick = () => {
      const a1 = +document.getElementById('n1').value;
      const b1 = +document.getElementById('n2').value;
      const c1 = +document.getElementById('n3').value;
      
      const a2 = +document.getElementById('n4').value;
      const b2 = +document.getElementById('n5').value;
      const c2 = +document.getElementById('n6').value;

      const d = a1 * b2 - b1 * a2;

      if (d === 0) {
        document.getElementById('result1').value = "Ошибка";
        document.getElementById('result2').value = "Ошибка";
        return;
      }

      document.getElementById('result1').value = (c1 * b2 - b1 * c2) / d;
      document.getElementById('result2').value = (a1 * c2 - c1 * a2) / d;
    };
  </script>
</body>
</html>
