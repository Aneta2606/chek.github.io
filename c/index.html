<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title></title>
</head>
<body>
  <h4>1161595</h4>
  <script>
    const params = new URLSearchParams(location.search);
    const rawA = params.get('A');
    const rawB = params.get('B');

    const rowX = rawA.split(',').map(Number);
    const rowY = rawB.split(',').map(Number);
    const n = rowX.length;

    let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0, sumY2 = 0;

    for (let i = 0; i < n; i++) {
      sumX += rowX[i];
      sumY += rowY[i];
      sumXY += rowX[i] * rowY[i];
      sumX2 += rowX[i] * rowX[i];
      sumY2 += rowY[i] * rowY[i];
    }

    const num = (n * sumXY) - (sumX * sumY);
    const den = Math.sqrt(((n * sumX2) - (sumX * sumX)) * ((n * sumY2) - (sumY * sumY)));

    let r = num / den;

    if (r < 0) r = -r;

    let resultStr = r.toString();

    if (resultStr === "1") {
      document.title = "1";
    } else {
      const dotIndex = resultStr.indexOf('.');
      if (dotIndex !== -1) {
        document.title = resultStr.slice(0, dotIndex + 4);
      } else {
        document.title = resultStr;
      }
    }
  </script>
</body>
</html>
